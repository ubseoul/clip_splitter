<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Splitpoint — clip splitter</title>
<style>
  :root{
    --bg: #0f1210;
    --bg-panel: #161b18;
    --bg-card: #1b211d;
    --line: #2a322c;
    --text: #eef2ee;
    --text-dim: #97a399;
    --accent: #c9ff3d;
    --accent-dim: #7c9a2a;
    --danger: #ff6b5e;
    --radius: 10px;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body { padding: 20px 16px 60px; max-width: 640px; margin: 0 auto; }

  .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .brand .mark { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); transform: rotate(45deg); flex: none; }
  .brand h1 { font-size: 1.05rem; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  .tagline { color: var(--text-dim); font-size: 0.85rem; margin: 0 0 24px; line-height: 1.4; }

  .panel { background: var(--bg-panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }

  .drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 32px 16px; text-align: center; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; }
  .drop.active { border-color: var(--accent); background: rgba(201,255,61,0.04); }
  .drop svg { margin-bottom: 10px; opacity: 0.7; }
  .drop-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
  .drop-sub { color: var(--text-dim); font-size: 0.8rem; }
  input[type=file] { display: none; }

  .filename { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; color: var(--text-dim); margin-top: 10px; }
  .filename button { background: none; border: none; color: var(--danger); font-size: 0.8rem; cursor: pointer; padding: 4px; }

  .controls-row { display: flex; gap: 10px; margin-top: 14px; }
  .field { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.72rem; color: var(--text-dim); }
  .field input[type=range] { width: 100%; accent-color: var(--accent); }
  .field .val { font-size: 0.78rem; color: var(--text); }

  button.primary { width: 100%; background: var(--accent); color: #10130f; border: none; border-radius: 8px; padding: 13px; font-size: 0.95rem; font-weight: 650; cursor: pointer; margin-top: 16px; transition: transform 0.1s ease, opacity 0.15s ease; }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.35; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; cursor: pointer; }

  .status { font-size: 0.82rem; color: var(--text-dim); margin-top: 12px; display: none; align-items: center; gap: 8px; }
  .status.show { display: flex; }
  .spinner { width: 13px; height: 13px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-track { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 10px; display: none; }
  .progress-track.show { display: block; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s ease; }

  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 28px 0 12px; }
  .section-head h2 { font-size: 0.95rem; font-weight: 650; margin: 0; }
  .section-head .count { color: var(--text-dim); font-size: 0.8rem; }

  .clip-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; }
  .clip-card video { width: 108px; height: 108px; border-radius: 7px; background: #000; object-fit: cover; flex: none; }
  .clip-meta { flex: 1; min-width: 0; }
  .clip-title { font-size: 0.88rem; font-weight: 600; margin: 0 0 3px; display: flex; align-items: center; gap: 8px; }
  .clip-time { color: var(--text-dim); font-size: 0.78rem; margin: 0 0 10px; }
  .clip-actions { display: flex; gap: 8px; }
  .clip-actions label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-dim); cursor: pointer; }
  .clip-actions input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  .dl-btn { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 5px 10px; font-size: 0.76rem; cursor: pointer; }

  .empty-note { text-align: center; color: var(--text-dim); font-size: 0.82rem; padding: 20px 0; }

  .footer-actions { display: flex; gap: 10px; margin-top: 4px; }
  .footer-actions button.primary { margin-top: 0; }

  .log-toggle { font-size: 0.75rem; color: var(--text-dim); text-align: center; margin-top: 18px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .log { display: none; background: #0a0c0a; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: ui-monospace, monospace; font-size: 0.68rem; color: var(--text-dim); max-height: 140px; overflow-y: auto; margin-top: 10px; white-space: pre-wrap; }
  .log.show { display: block; }
</style>
</head>
<body>

  <div class="brand">
    <div class="mark"></div>
    <h1>Splitpoint</h1>
  </div>
  <p class="tagline">Upload a video and it slices the whole thing into short clips you can preview and keep. Clips are video-only, no audio.</p>

  <div class="panel">
    <div class="drop" id="drop">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c9ff3d" stroke-width="1.6"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      <div class="drop-title">Choose a video</div>
      <div class="drop-sub">Opens your camera roll · MP4 or MOV</div>
      <input type="file" id="fileInput" accept="video/*">
    </div>
    <div class="filename" id="filenameRow" style="display:none;">
      <span id="filenameText"></span>
      <button id="clearFile">Remove</button>
    </div>

    <div class="controls-row">
      <div class="field">
        <label>Clip length</label>
        <input type="range" id="clipLength" min="1" max="10" step="0.5" value="3">
        <span class="val" id="clipLengthVal">3.0 s</span>
      </div>
    </div>

    <button class="primary" id="processBtn" disabled>Split into clips</button>

    <div class="status" id="statusRow">
      <div class="spinner"></div>
      <span id="statusText">Loading…</span>
    </div>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="log-toggle" id="logToggle" style="display:block;">hide technical log</div>
    <div class="log show" id="log"></div>
  </div>

  <div id="resultsWrap" style="display:none;">
    <div class="section-head">
      <h2>Clips</h2>
      <span class="count" id="clipCount"></span>
    </div>
    <div id="clipList"></div>
    <div class="footer-actions">
      <button class="secondary" id="selectAllBtn">Select all</button>
      <button class="primary" id="downloadSelectedBtn">Download selected</button>
    </div>
  </div>

  <div class="empty-note" id="emptyNote">No clips yet — upload a video above to get started.</div>
  <p style="text-align:center; color:var(--text-dim); font-size:0.68rem; margin-top:24px;">build: ffmpeg-umd-v3</p>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script type="module">
const { FFmpeg } = FFmpegWASM;
const { fetchFile } = FFmpegUtil;

const $ = (id) => document.getElementById(id);
const drop = $('drop'), fileInput = $('fileInput'), filenameRow = $('filenameRow'),
      filenameText = $('filenameText'), clearFile = $('clearFile'),
      processBtn = $('processBtn'), statusRow = $('statusRow'), statusText = $('statusText'),
      progressTrack = $('progressTrack'), progressFill = $('progressFill'),
      resultsWrap = $('resultsWrap'), clipList = $('clipList'), clipCount = $('clipCount'),
      emptyNote = $('emptyNote'), selectAllBtn = $('selectAllBtn'), downloadSelectedBtn = $('downloadSelectedBtn'),
      logToggle = $('logToggle'), log = $('log'),
      clipLength = $('clipLength'), clipLengthVal = $('clipLengthVal');

let ffmpeg = null;
let ready = false;
let currentFile = null;
let clips = []; // {url, blob, start, end, index, name}
let sessionStamp = '';

function setStatus(msg, show = true) {
  statusText.textContent = msg;
  statusRow.classList.toggle('show', show);
}
function appendLog(line) {
  log.textContent += line + '\n';
  log.scrollTop = log.scrollHeight;
  logToggle.style.display = 'block';
}
function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(1);
  return `${m}:${sec.padStart(4,'0')}`;
}

logToggle.addEventListener('click', () => {
  log.classList.toggle('show');
  logToggle.textContent = log.classList.contains('show') ? 'hide technical log' : 'show technical log';
});

clipLength.addEventListener('input', () => {
  clipLengthVal.textContent = `${parseFloat(clipLength.value).toFixed(1)} s`;
  saveSettings();
});

function saveSettings() {
  try {
    localStorage.setItem('splitpoint_settings', JSON.stringify({ clipLength: clipLength.value }));
  } catch (e) { /* storage unavailable, ignore */ }
}
function restoreSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem('splitpoint_settings'));
    if (saved && saved.clipLength) {
      clipLength.value = saved.clipLength;
      clipLengthVal.textContent = `${parseFloat(clipLength.value).toFixed(1)} s`;
    }
  } catch (e) { /* no saved settings yet */ }
}
restoreSettings();

// Cache the ~25MB engine permanently after the first download, so every
// visit after the first loads it from local cache instead of the network.
async function loadCachedURL(url, mimeType) {
  appendLog(`[load] requesting ${url.split('/').pop()}`);
  try {
    const cache = await caches.open('splitpoint-engine-v2-umd');
    appendLog('[load] cache opened');
    let response = await cache.match(url);
    if (!response) {
      appendLog('[load] not in cache — fetching from network…');
      response = await fetch(url);
      appendLog(`[load] fetch responded, status ${response.status}`);
      if (response.ok) {
        await cache.put(url, response.clone());
        appendLog('[load] stored in cache');
      }
    } else {
      appendLog('[load] found in cache, using it');
    }
    const blob = await response.blob();
    appendLog(`[load] blob ready, ${(blob.size / 1024 / 1024).toFixed(1)}MB`);
    return URL.createObjectURL(new Blob([blob], { type: mimeType }));
  } catch (e) {
    appendLog('[load] CACHE ERROR: ' + (e?.message || e) + ' — falling back to direct fetch');
    const resp = await fetch(url);
    const blob = await resp.blob();
    appendLog(`[load] fallback blob ready, ${(blob.size / 1024 / 1024).toFixed(1)}MB`);
    return URL.createObjectURL(new Blob([blob], { type: mimeType }));
  }
}

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} timed out after ${ms/1000}s — something is stuck, not just slow`)), ms))
  ]);
}

async function initFFmpeg() {
  log.classList.add('show');
  logToggle.style.display = 'block';
  logToggle.textContent = 'hide technical log';
  appendLog('[init] starting engine load…');

  ffmpeg = new FFmpeg();
  ffmpeg.on('log', ({ message }) => appendLog(message));
  const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';

  const alreadyCached = await caches.open('splitpoint-engine-v2-umd')
    .then(c => c.match(`${baseURL}/ffmpeg-core.wasm`))
    .catch(() => null);
  appendLog(`[init] already cached: ${!!alreadyCached}`);
  setStatus(alreadyCached ? 'Loading engine…' : 'Downloading engine (one-time only — instant every time after)…');
  statusRow.classList.add('show');

  const coreURL = await withTimeout(loadCachedURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'), 30000, 'Loading core.js');
  const wasmURL = await withTimeout(loadCachedURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'), 30000, 'Loading .wasm');

  appendLog('[init] calling ffmpeg.load()…');
  await withTimeout(ffmpeg.load({ coreURL, wasmURL }), 30000, 'ffmpeg.load()');
  appendLog('[init] ffmpeg.load() completed');

  ready = true;
  setStatus('', false);
  processBtn.disabled = !currentFile;
}
initFFmpeg().catch(err => {
  setStatus('Engine failed to load — see technical log below.');
  appendLog('[init] FATAL: ' + (err?.message || err));
});

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) selectFile(e.target.files[0]);
});

function selectFile(file) {
  currentFile = file;
  filenameText.textContent = `${file.name} · ${(file.size / (1024*1024)).toFixed(1)} MB`;
  filenameRow.style.display = 'flex';
  drop.style.display = 'none';
  processBtn.disabled = !ready;

  const sizeMB = file.size / (1024*1024);
  emptyNote.style.display = 'block';
  if (sizeMB > 150) {
    emptyNote.textContent = `Heads up — this file is ${sizeMB.toFixed(0)}MB. Processing happens entirely on your phone, so long or high-res videos can take a while and may stall on older devices.`;
  } else {
    emptyNote.textContent = 'No clips yet — tap "Split into clips" to get started.';
  }
}
clearFile.addEventListener('click', () => {
  currentFile = null;
  fileInput.value = '';
  filenameRow.style.display = 'none';
  drop.style.display = 'block';
  processBtn.disabled = true;
});

processBtn.addEventListener('click', async () => {
  if (!currentFile || !ready) return;

  const now = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  sessionStamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;

  clipList.innerHTML = '';
  clips.forEach(c => URL.revokeObjectURL(c.url));
  clips = [];
  resultsWrap.style.display = 'none';
  emptyNote.style.display = 'block';
  emptyNote.textContent = 'Working on it…';
  processBtn.disabled = true;
  progressTrack.classList.add('show');
  progressFill.style.width = '5%';

  try {
    const inputName = 'input' + (currentFile.name.match(/\.\w+$/)?.[0] || '.mp4');
    setStatus('Reading file…');
    await ffmpeg.writeFile(inputName, await fetchFile(currentFile));
    await splitFixedLength(inputName);
    renderClips();
    setStatus('', false);
  } catch (err) {
    appendLog('ERROR: ' + (err?.message || err));
    emptyNote.textContent = 'Something went wrong processing this file. Check the technical log below, or try a different video.';
    setStatus('', false);
  }
  progressTrack.classList.remove('show');
  processBtn.disabled = false;
});

async function splitFixedLength(inputName) {
  setStatus('Slicing into clips…');
  const segLen = parseFloat(clipLength.value);
  const pattern = 'out_%03d.mp4';

  await ffmpeg.exec([
    '-i', inputName,
    '-c:v', 'copy',
    '-an',                 // strip audio — video-only clips, no re-encode
    '-map', '0:v:0',
    '-f', 'segment',
    '-segment_time', segLen.toFixed(2),
    '-reset_timestamps', '1',
    pattern
  ]);

  const files = (await ffmpeg.listDir('/'))
    .filter(f => f.name.startsWith('out_') && f.name.endsWith('.mp4'))
    .sort((a, b) => a.name.localeCompare(b.name));

  if (files.length === 0) {
    throw new Error('No clips were produced — this file\'s format may not be supported.');
  }

  for (let i = 0; i < files.length; i++) {
    const data = await ffmpeg.readFile(files[i].name);
    const blob = new Blob([data.buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);
    clips.push({
      url, blob,
      start: i * segLen,
      end: (i + 1) * segLen,
      index: i,
      name: `clip_${sessionStamp}_${i + 1}.mp4`
    });
    await ffmpeg.deleteFile(files[i].name);
    progressFill.style.width = `${Math.round(((i + 1) / files.length) * 100)}%`;
  }
  await ffmpeg.deleteFile(inputName);
}

function renderClips() {
  if (clips.length === 0) {
    emptyNote.style.display = 'block';
    emptyNote.textContent = 'No clips produced — try a different clip length.';
    resultsWrap.style.display = 'none';
    return;
  }
  emptyNote.style.display = 'none';
  resultsWrap.style.display = 'block';
  clipCount.textContent = `${clips.length} clip${clips.length > 1 ? 's' : ''}`;
  clipList.innerHTML = '';

  const allVideos = [];

  clips.forEach((clip, i) => {
    const card = document.createElement('div');
    card.className = 'clip-card';
    card.innerHTML = `
      <video data-src="${clip.url}" muted playsinline preload="none"></video>
      <div class="clip-meta">
        <p class="clip-title">Clip ${i + 1}</p>
        <p class="clip-time">${fmtTime(clip.start)} – ${fmtTime(clip.end)} · ${(clip.end - clip.start).toFixed(1)}s</p>
        <div class="clip-actions">
          <label><input type="checkbox" class="clip-check" data-idx="${i}"> Keep</label>
          <button class="dl-btn" data-idx="${i}">Download</button>
        </div>
      </div>
    `;
    const video = card.querySelector('video');
    allVideos.push(video);

    video.addEventListener('click', () => {
      allVideos.forEach(v => { if (v !== video) v.pause(); });
      if (video.paused) video.play(); else video.pause();
    });
    card.querySelector('.dl-btn').addEventListener('click', () => downloadClip(i));
    clipList.appendChild(card);
  });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target;
      if (entry.isIntersecting) {
        if (!video.src && video.dataset.src) {
          video.preload = 'metadata';
          video.src = video.dataset.src;
        }
      } else {
        video.pause();
        video.removeAttribute('src');
        video.load();
      }
    });
  }, { rootMargin: '200px 0px' });

  allVideos.forEach(v => observer.observe(v));
}

function downloadClip(i) {
  const clip = clips[i];
  // iOS Safari routes video/mp4 blobs to a "Save Video" -> Photos action.
  // Re-typing as a generic binary makes it download as a normal file instead.
  const downloadBlob = new Blob([clip.blob], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(downloadBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = clip.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

selectAllBtn.addEventListener('click', () => {
  const boxes = document.querySelectorAll('.clip-check');
  const allChecked = [...boxes].every(b => b.checked);
  boxes.forEach(b => b.checked = !allChecked);
  selectAllBtn.textContent = allChecked ? 'Select all' : 'Deselect all';
});

downloadSelectedBtn.addEventListener('click', async () => {
  const boxes = document.querySelectorAll('.clip-check:checked');
  if (boxes.length === 0) { alert('Check the clips you want first.'); return; }

  if (boxes.length === 1) {
    downloadClip(parseInt(boxes[0].dataset.idx));
    return;
  }

  const originalLabel = downloadSelectedBtn.textContent;
  downloadSelectedBtn.textContent = 'Zipping…';
  downloadSelectedBtn.disabled = true;

  try {
    const zip = new JSZip();
    boxes.forEach(b => {
      const clip = clips[parseInt(b.dataset.idx)];
      zip.file(clip.name, clip.blob);
    });
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `clips_${sessionStamp}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) {
    appendLog('ZIP ERROR: ' + (e?.message || e));
    alert('Could not create the zip file — check the technical log below.');
  }

  downloadSelectedBtn.textContent = originalLabel;
  downloadSelectedBtn.disabled = false;
});
</script>
</body>
</html>
